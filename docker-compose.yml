# Docker compose configuration for PintaEbook Backend testing
services:
  # --- CONTENEDOR 1: BASE DE DATOS ---
  db:
    image: postgres:16-alpine    # Descarga la imagen oficial de PostgreSQL 16
    container_name: pintaebook_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pintaebook_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Guarda los datos en disco para no perderlos si se apaga
    ports:
      - "5432:5432"
 
  # --- CONTENEDOR 2: REDIS 7 (Channel Layer para Django Channels) ---
  redis:
    image: redis:7-alpine
    container_name: pintaebook_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- CONTENEDOR 3: DJANGO BACKEND ---
  web:
    build: .
    container_name: pintaebook_backend
    restart: always
    # Daphne: servidor ASGI que soporta HTTP/1.1, HTTP/2 y WebSockets
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env              # Secretos y config dinámica (MONGO_URI, API keys, etc.)
    environment:
      # Solo variables de infraestructura fijas (no secretos, no van a .gitignore)
      - DJANGO_SETTINGS_MODULE=config.settings.local
    depends_on:
      db:
        condition: service_started   # PostgreSQL no tiene healthcheck; arranca y listo
      redis:
        condition: service_healthy   # Espera a que redis-cli ping responda OK

volumes:
  postgres_data: